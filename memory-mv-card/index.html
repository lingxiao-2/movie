<!doctype html><html><head><meta charset="utf-8"><title>一周年贺卡开场</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c"></canvas><script type="module">
import { load, frame, DUR } from './js/opening.js';
const cv = document.getElementById('c'); cv.width = innerWidth; cv.height = innerHeight;
