<body><canvas id="c"></canvas><script type="module">
import { load, frame, DUR, FONTS } from './js/film.js';
const cv = document.getElementById('c'); cv.width = innerWidth; cv.height = innerHeight;
window.DUR = DUR; window.render = t => frame(t); window.TEXTS = () => [];
(async () => { for (const [f, s] of FONTS()) await document.fonts.load(f, s); await document.fonts.ready; load(cv.getContext('2d'), innerWidth, innerHeight); window.READY = true; })();
</script></body></html>
