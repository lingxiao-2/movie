<!doctype html><html><head><meta charset="utf-8"><title>把回忆拼好给你 · 一周年纪念</title>
<link rel="stylesheet" href="fonts.css"><style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c"></canvas><script type="module">
import { load, frame, DUR } from './js/film.js';
const cv = document.getElementById('c'); cv.width = innerWidth; cv.height = innerHeight;
window.DUR = DUR; window.render = t => frame(t); window.TEXTS = () => [];
(async () => { await document.fonts.ready; await Promise.all([document.fonts.load('600 46px Lyric', '有你在的日子'), document.fonts.load('500 128px DateF', '2025.11.15'), document.fonts.load('64px HandZh', '那天你从家里赶来给我送药烤冷面我们的故事')]); await load(innerWidth, innerHeight, cv.getContext('2d')); window.READY = true; })();
</script></body></html>
