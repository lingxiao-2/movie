<!doctype html><html><head><meta charset="utf-8"><title>第五幕 纸艺舞台测试</title>
<link rel="stylesheet" href="fonts.css"><style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c"></canvas><script type="module">
import { load, frame, DUR } from './js/stage5.js';
const cv = document.getElementById('c'); cv.width = innerWidth; cv.height = innerHeight;
window.DUR = DUR; window.render = t => frame(t); window.TEXTS = () => [];
(async () => { await document.fonts.ready; await Promise.all([document.fonts.load('600 46px Lyric', '你对我说的情话像转瞬即逝的烟花只停在绽放一刹那'), document.fonts.load('500 128px DateF', '2025.11.15')]); await load(innerWidth, innerHeight, cv.getContext('2d')); window.READY = true; })();
</script></body></html>
