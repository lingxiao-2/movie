<!doctype html>
<html><head><meta charset="utf-8"><title>把回忆拼好给你</title>
<link rel="stylesheet" href="fonts.css">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
import { load, frame, DUR, TIMELINE } from './js/film.js';
const cv = document.getElementById('c'); cv.width = innerWidth; cv.height = innerHeight;
window.DUR = DUR; window.render = t => frame(t); window.TEXTS = () => []; window.TIMELINE = TIMELINE;
(async () => {
  await document.fonts.ready;
  await Promise.all([['600 46px Lyric', '我们都是渺小'], ['500 128px DateF', '2025.11.15'], ['76px HandZh', '我们的故事']].map(([f, s]) => document.fonts.load(f, s)));
  await load(innerWidth, innerHeight, cv.getContext('2d')); window.READY = true;
})();
</script></body></html>
